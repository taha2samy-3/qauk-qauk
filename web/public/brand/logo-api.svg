<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t-api">
  <title id="t-api">Quack Quack - Integration API and tokens</title>
  <defs>
    <linearGradient id="qq-api-bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.45" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="qq-api-gold" x1="38" y1="34" x2="58" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <filter id="qq-api-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#qq-api-bg)"/>

  <!-- API braces around the duck: what the platform exposes -->
  <path d="M14 13C9.5 13 9.5 16 9.5 19.5V25C9.5 27.5 8 29 6 29C8 29 9.5 30.5 9.5 33V38.5C9.5 42 9.5 45 14 45" fill="none" stroke="#C4B5FD" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 13C42.5 13 42.5 16 42.5 19.5V25C42.5 27.5 44 29 46 29C44 29 42.5 30.5 42.5 33V38.5" fill="none" stroke="#C4B5FD" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Duck -->
  <path d="M15 33C13.4 36.6 11.6 38.2 9.4 38C10 42.6 13.2 45 17.6 45H27C30.6 45 32.6 43 32.6 40.2C32.6 36.6 29 34.2 24.6 33.2Z" fill="#FFFFFF"/>
  <circle cx="20" cy="26" r="8" fill="#FFFFFF"/>
  <path d="M26.6 24.6C30.2 23.7 33.8 24.2 35.8 26.4C33.9 29 30.3 29.7 26.6 28.8Z" fill="#FBBF24"/>
  <circle cx="22.2" cy="23.6" r="1.8" fill="#1E1B4B"/>

  <!-- Token key: Bearer qk_… -->
  <g filter="url(#qq-api-shadow)">
    <circle cx="44" cy="44" r="6.5" fill="none" stroke="url(#qq-api-gold)" stroke-width="3.6"/>
    <circle cx="44" cy="44" r="2" fill="#FFFFFF"/>
    <line x1="48.8" y1="48.8" x2="56" y2="56" stroke="url(#qq-api-gold)" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="52.6" y1="52.6" x2="55.4" y2="49.8" stroke="url(#qq-api-gold)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Live stream pulses -->
  <path d="M50 12.5A7.5 7.5 0 0 1 55.5 20" fill="none" stroke="#67E8F9" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M50 17.5A3 3 0 0 1 51.8 20" fill="none" stroke="#67E8F9" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="49.5" cy="21.5" r="1.8" fill="#67E8F9"/>
</svg>
