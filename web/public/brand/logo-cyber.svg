<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t-cyber">
  <title id="t-cyber">Quack Quack - Cyber Dark Edition</title>
  <defs>
    <linearGradient id="qq-cyber-border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="qq-cyber-glow" x1="10" y1="10" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Dark cyber container with gradient border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0B0F19" stroke="url(#qq-cyber-border)" stroke-width="2"/>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#qq-cyber-glow)"/>
  
  <!-- Subtle tech grid lines -->
  <line x1="2" y1="22" x2="62" y2="22" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="2" y1="42" x2="62" y2="42" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 3"/>
  <line x1="32" y1="2" x2="32" y2="62" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 3"/>
  
  <!-- Duck body with subtle cyan aura -->
  <path d="M16.5 35.5C14.2 41.2 11 43.6 6.6 43.2C7.4 49.8 12.2 53.5 19 53.5H32.5C37.4 53.5 40.5 50.6 40.5 46.6C40.5 41.4 35.4 37.7 29 36.2Z" fill="#F8FAFC"/>
  <circle cx="22.5" cy="27.5" r="11" fill="#F8FAFC"/>
  
  <!-- Beak -->
  <path d="M31.5 25.6C36.4 24.4 41.4 25 44.2 28.1C41.6 31.6 36.6 32.6 31.5 31.4Z" fill="#FBBF24"/>
  
  <!-- Eye with neon cyan iris ring -->
  <circle cx="25.4" cy="24.4" r="2.4" fill="#0B0F19"/>
  <circle cx="25.4" cy="24.4" r="1" fill="#38BDF8"/>
  
  <!-- Glowing neon signal waves -->
  <g filter="url(#neon-glow)">
    <path d="M47.5 23.8A6.4 6.4 0 0 1 47.5 32.4" fill="none" stroke="#38BDF8" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M51.6 18.6A12.6 12.6 0 0 1 51.6 37.6" fill="none" stroke="#818CF8" stroke-width="2.6" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
