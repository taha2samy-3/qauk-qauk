<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t-elem">
  <title id="t-elem">Quack Quack - Telemetry Element</title>
  <defs>
    <linearGradient id="qq-elem-bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.4" stop-color="#0369A1"/>
      <stop offset="0.8" stop-color="#0284C7"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="qq-elem-glow" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="qq-elem-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#qq-elem-bg)"/>
  
  <!-- Subtle Brand Motif: Quack Sonar Waves -->
  <path d="M12 20 A 24 24 0 0 1 20 12" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" opacity="0.35"/>
  <path d="M52 44 A 24 24 0 0 1 44 52" fill="none" stroke="#2DD4BF" stroke-width="1.8" stroke-linecap="round" opacity="0.35"/>

  <!-- Hero Telemetry Matrix / Element Blocks -->
  <!-- Top-Left Node (Telemetry In) -->
  <rect x="15" y="15" width="14" height="14" rx="4" fill="#FFFFFF" filter="url(#qq-elem-shadow)"/>
  <circle cx="22" cy="22" r="3.2" fill="#0284C7"/>
  <circle cx="22" cy="22" r="1.3" fill="#FFFFFF"/>
  
  <!-- Top-Right Node (Channel Transform) -->
  <rect x="35" y="15" width="14" height="14" rx="4" fill="#FFFFFF" filter="url(#qq-elem-shadow)"/>
  <path d="M39 22 H45 M42 19 V25" stroke="#0D9488" stroke-width="2.2" stroke-linecap="round"/>
  
  <!-- Bottom-Left Node (Active Telemetry Pulse) -->
  <rect x="15" y="35" width="14" height="14" rx="4" fill="#FFFFFF" filter="url(#qq-elem-shadow)"/>
  <path d="M18.5 42 L20.8 39 L23.2 45 L25.5 42" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom-Right Hero Node (Value Beacon with Quack Beak Gold) -->
  <rect x="35" y="35" width="14" height="14" rx="4" fill="#FBBF24" filter="url(#qq-elem-shadow)"/>
  <circle cx="42" cy="42" r="3.2" fill="#78350F"/>
  <circle cx="42" cy="42" r="1.2" fill="#FFFFFF"/>

  <!-- Interconnecting Data Channel Bus Lines -->
  <line x1="29" y1="22" x2="35" y2="22" stroke="#BAE6FD" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="22" y1="29" x2="22" y2="35" stroke="#BAE6FD" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="42" y1="29" x2="42" y2="35" stroke="#FDE68A" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="29" y1="42" x2="35" y2="42" stroke="#FDE68A" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Center Cross-Node Signal Point -->
  <circle cx="32" cy="32" r="2.4" fill="#FFFFFF"/>
  <circle cx="32" cy="32" r="1" fill="#0369A1"/>
</svg>
