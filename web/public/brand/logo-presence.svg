<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t-pres">
  <title id="t-pres">Quack Quack - Device &amp; Gateway Presence</title>
  <defs>
    <linearGradient id="qq-pres-bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#022C22"/>
      <stop offset="0.4" stop-color="#064E3B"/>
      <stop offset="0.8" stop-color="#059669"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="qq-pres-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#qq-pres-bg)"/>

  <!-- Radar Concentric Presence Rings -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#6EE7B7" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.4"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#A7F3D0" stroke-width="1.5" opacity="0.6"/>

  <!-- Live Pulse Horizon Line -->
  <line x1="8" y1="32" x2="20" y2="32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="44" y1="32" x2="56" y2="32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Dynamic EKG Heartbeat Spike -->
  <path d="M19 32 L23 32 L27 20 L32 44 L37 25 L41 35 L45 32" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#qq-pres-shadow)"/>

  <!-- Heartbeat Peak Node (Neon Emerald) -->
  <circle cx="27" cy="20" r="3.2" fill="#4ADE80" filter="url(#qq-pres-shadow)"/>
  <circle cx="27" cy="20" r="1.3" fill="#FFFFFF"/>

  <!-- Center Active Liveness Beacon (Quack Amber & Emerald) -->
  <circle cx="32" cy="32" r="3.8" fill="#FBBF24" filter="url(#qq-pres-shadow)"/>
  <circle cx="32" cy="32" r="1.5" fill="#78350F"/>
</svg>
