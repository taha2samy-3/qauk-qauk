# Development broker for the MQTT transport (profile "mqtt"). NOT for production.
per_listener_settings true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# 1883: anonymous, for the demo and quick tests
listener 1883
allow_anonymous true

# 1884: username/password (quack / quack), to test password auth and bad credentials
listener 1884
allow_anonymous false
password_file /mosquitto/config/passwd

# 8883: TLS with client certificates (task mqtt:certs), to test mTLS
listener 8883
allow_anonymous false
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
use_identity_as_username true
