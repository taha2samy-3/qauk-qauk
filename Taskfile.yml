# Quack Quack task runner. Tools are pinned in mise.toml (`mise install`).
version: "3"

includes:
  contract: ./server/contracttest/Taskfile.yml
  web: ./web/Taskfile.yml
  docs: ./docs/Taskfile.yml
  nodered: ./integrations/node-red/Taskfile.yml

vars:
  COMPOSE: docker compose -f docker/compose.yaml
  DEV_DB: postgres://quack:quack@127.0.0.1:5433/quack?sslmode=disable
  DEV_KAFKA: 127.0.0.1:19092
  BIN: "{{.ROOT_DIR}}/server/bin/quack"
  # History store: timescale (default) or clickhouse, e.g. `task start HISTORY=clickhouse`.
  HISTORY: '{{.HISTORY | default "timescale"}}'
  CH_HOST_URL: clickhouse://quack:quack@127.0.0.1:19000/quack
  # buf is run from the Go module proxy (no separate install).
  BUF: go run github.com/bufbuild/buf/cmd/buf@v1.73.0

env:
  QUACK_DATABASE_URL: '{{.QUACK_DATABASE_URL | default .DEV_DB}}'
  QUACK_KAFKA_BROKERS: '{{.QUACK_KAFKA_BROKERS | default .DEV_KAFKA}}'
  QUACK_COOKIE_SECURE: "false"
  QUACK_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
  QUACK_WEB_DIR: "{{.ROOT_DIR}}/web/dist"
  QUACK_HISTORY_DRIVER: '{{.QUACK_HISTORY_DRIVER | default .HISTORY}}'
  QUACK_HISTORY_URL: '{{if .QUACK_HISTORY_URL}}{{.QUACK_HISTORY_URL}}{{else if eq .HISTORY "clickhouse"}}{{.CH_HOST_URL}}{{end}}'
  QUACK_HISTORY_CONTAINER_URL: '{{if eq .HISTORY "clickhouse"}}clickhouse://quack:quack@clickhouse:9000/quack{{end}}'

tasks:
  default:
    cmds: [task --list]
    silent: true

  start:
    desc: "Run the whole platform locally: infra, API+gateway (:8080), ingester, demo devices, web app (:5173). Ctrl+C stops it."
    preconditions:
      - sh: "! curl -s -o /dev/null --max-time 1 http://127.0.0.1:8080/healthz"
        msg: "The platform already seems to be running (port 8080). Use it, or run `task stop` first."
      - sh: "! curl -s -o /dev/null --max-time 1 http://127.0.0.1:5173/"
        msg: "Something is already serving the web app on port 5173. Run `task stop` first."
    cmds:
      - task: infra:up
      - task: demo          # idempotent: seeds the demo once (admin/admin12345)
      - task: start:procs
  stop:
    desc: Stop everything `task start` runs (keeps the database and Redpanda running; `task infra:down` stops those)
    cmds:
      - cmd: pkill -f "server/bin/quack (serve|ingest|dev simulate)"
        ignore_error: true
      - cmd: pkill -f "web/node_modules/.bin/../vite/bin/vite.js|nodered/web.*vite"
        ignore_error: true
      - echo "stopped"

  start:procs:
    internal: true
    # deps run in parallel; the simulator retries until the gateway is up
    deps: [dev, ingest, simulate, web:dev]

  tools:
    desc: Install pinned tools (go, task, golangci-lint, node, pnpm)
    cmds: [mise install]

  # --- infrastructure ---
  infra:up:
    desc: "Start Postgres/TimescaleDB + Redpanda (+ ClickHouse with HISTORY=clickhouse) for local development"
    cmds: ['{{.COMPOSE}} up -d --wait db redpanda{{if eq .HISTORY "clickhouse"}} clickhouse{{end}}']
  infra:down:
    desc: Stop local infrastructure (keeps volumes)
    cmds: ["{{.COMPOSE}} --profile app --profile tools --profile clickhouse down"]
  infra:reset:
    desc: Stop infrastructure and delete all data volumes
    prompt: This deletes the local database, ClickHouse and Redpanda data. Continue?
    cmds: ["{{.COMPOSE}} --profile app --profile tools --profile clickhouse down -v"]
  console:
    desc: Start Redpanda Console on http://127.0.0.1:8090
    cmds: ["{{.COMPOSE}} --profile tools up -d console"]

  # --- go backend ---
  build:
    desc: Build the quack binary into server/bin/
    dir: server
    sources: ["**/*.go", "migrations/*.sql", "schemas/*.json", go.mod, go.sum]
    generates: [bin/quack]
    cmds: [go build -o bin/quack ./cmd/quack]
  migrate:
    desc: Apply DB migrations and create Redpanda topics
    deps: [build]
    cmds: ["{{.BIN}} migrate"]
  dev:
    desc: Run api+gateway locally on :8080 (needs infra:up)
    deps: [migrate]
    cmds: ["{{.BIN}} serve"]
  ingest:
    desc: Run the history ingester locally (metrics on :9100)
    deps: [build]
    env: {QUACK_HTTP_ADDR: ":9100"}
    cmds: ["{{.BIN}} ingest"]
  admin:create:
    desc: "Create an admin user: task admin:create ADMIN=alice"
    deps: [build]
    requires: {vars: [ADMIN]}
    cmds: ["{{.BIN}} admin create-user --admin --username {{.ADMIN}}"]
  demo:
    desc: "Seed demo devices/elements + admin (admin/admin12345) into the dev DB"
    deps: [migrate]
    cmds: ["{{.BIN}} dev demo --out {{.ROOT_DIR}}/server/bin/demo-devices.json"]
  simulate:
    desc: "Stream live values from the demo devices; TRANSPORT=mixed (default: one device each over WebSocket, REST, gRPC), websocket, rest or grpc"
    deps: [build]
    cmds: ["{{.BIN}} dev simulate --file {{.ROOT_DIR}}/server/bin/demo-devices.json --ws-base ws://127.0.0.1:8080 --transport {{.TRANSPORT | default \"mixed\"}}"]
  import:django:
    desc: "Import the legacy Django DB: task import:django FROM=postgres://..."
    deps: [migrate]
    requires: {vars: [FROM]}
    cmds: ["{{.BIN}} import-django --from '{{.FROM}}'"]

  # --- protobuf (device gRPC API) ---
  proto:gen:
    desc: Regenerate Go code from server/proto (buf, built from the Go module proxy)
    dir: server
    cmds: ["{{.BUF}} lint", "{{.BUF}} generate"]
  proto:check:
    desc: Fail if the proto doesn't lint, or the generated code is stale
    dir: server
    cmds:
      - "{{.BUF}} lint"
      - "{{.BUF}} generate"
      - git diff --exit-code -- internal/gen

  # --- quality ---
  fmt:
    dir: server
    cmds: [gofmt -w .]
  lint:
    desc: golangci-lint (incl. the contract suite)
    dir: server
    cmds: ["golangci-lint run --build-tags contract,load,integration ./..."]
  test:
    desc: Unit tests with the race detector
    dir: server
    cmds: [go test -race ./...]
  test:integration:
    desc: "Integration tests against local infra (needs infra:up). HISTORY=clickhouse runs them on ClickHouse"
    dir: server
    env:
      QUACK_IT_HISTORY_DRIVER: "{{.HISTORY}}"
      QUACK_IT_HISTORY_URL: '{{if eq .HISTORY "clickhouse"}}clickhouse://quack:quack@127.0.0.1:19000/quack_it{{end}}'
      QUACK_IT_CLICKHOUSE_URL: '{{.QUACK_IT_CLICKHOUSE_URL | default "clickhouse://quack:quack@127.0.0.1:19000/quack_history_it"}}'
    cmds: [go test -race -tags integration -count=1 ./...]
  test:history:
    desc: "The history-store contract on every driver (TimescaleDB, and ClickHouse with infra:up HISTORY=clickhouse)"
    dir: server
    env:
      QUACK_IT_CLICKHOUSE_URL: '{{.QUACK_IT_CLICKHOUSE_URL | default "clickhouse://quack:quack@127.0.0.1:19000/quack_history_it"}}'
    cmds: [go test -tags integration -count=1 -v ./internal/history/...]
  contract:go:
    desc: "Run the WebSocket contract suite against the Go backend (needs infra:up; HISTORY=clickhouse for ClickHouse)"
    env:
      QUACK_HISTORY_URL: '{{if eq .HISTORY "clickhouse"}}clickhouse://quack:quack@127.0.0.1:19000/quack_contract{{end}}'
    cmds: [bash server/contracttest/go/run.sh]
  check:
    desc: Everything CI runs
    cmds:
      - task: lint
      - task: test
      - task: test:integration
      - task: contract:go

  # --- containers ---
  docker:build:
    desc: Build the quack image (backend + frontend)
    cmds: ["{{.COMPOSE}} --profile app build"]
  up:
    desc: "Run the full stack in containers on http://127.0.0.1:8080 (HISTORY=clickhouse for ClickHouse)"
    cmds: ['{{.COMPOSE}} --profile app{{if eq .HISTORY "clickhouse"}} --profile clickhouse{{end}} up -d --build --wait']
