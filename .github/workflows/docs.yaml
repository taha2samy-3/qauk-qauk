name: Docs

# Builds the VitePress site in docs/ and publishes it to GitHub Pages.
#
# One-time repo setup (the default GITHUB_TOKEN is not allowed to do this):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# The build job never depends on that setting, so pull requests (and a repo
# without Pages yet) still get the dead-link / render check.
on:
  push:
    branches: [main, master]
    paths: ['docs/**', 'branding/**', 'mise.toml', '.github/workflows/docs.yaml']
  pull_request:
    paths: ['docs/**', 'branding/**', 'mise.toml', '.github/workflows/docs.yaml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs (fails on dead links and render errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # "last updated" timestamps come from git history
      - uses: jdx/mise-action@v5
      - name: Build
        run: task docs:build
        env:
          # Project pages are served under /<repo>/. For a custom domain set the
          # repository variable DOCS_BASE to "/".
          DOCS_BASE: ${{ vars.DOCS_BASE || format('/{0}/', github.event.repository.name) }}
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "::error title=GitHub Pages is not enabled::Open ${{ github.server_url }}/${{ github.repository }}/settings/pages and set 'Build and deployment → Source' to 'GitHub Actions', then re-run this workflow. The docs were built successfully; only publishing is blocked."
            exit 1
          fi
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
