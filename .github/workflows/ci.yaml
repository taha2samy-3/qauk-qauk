name: Quack CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Releases live in their own workflows: release-image.yaml (tags v*) and
# release-node-red.yaml (tags node-red-v*).

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (history on ${{ matrix.history }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every test runs against each history store. ClickHouse is started in
        # both legs, so the history-store contract always covers both drivers.
        history: [timescale, clickhouse]
    env:
      HISTORY: ${{ matrix.history }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Lint
        if: matrix.history == 'timescale'
        run: task lint
      - name: Unit tests (race)
        if: matrix.history == 'timescale'
        run: task test
      - name: Start Postgres/TimescaleDB, Redpanda and ClickHouse
        run: HISTORY=clickhouse task infra:up
      - name: Create test databases
        run: |
          docker compose -f docker/compose.yaml exec -T db psql -U quack -d quack -c "CREATE DATABASE quack_contract" || true
          docker compose -f docker/compose.yaml exec -T db psql -U quack -d quack -c "CREATE DATABASE quack_it" || true
      - name: History-store contract (every driver)
        if: matrix.history == 'timescale'
        run: task test:history
      - name: Integration tests
        run: task test:integration
      - name: WebSocket contract suite (server built with -race)
        run: QUACK_BUILD_FLAGS=-race task contract:go
      - name: Infra logs on failure
        if: failure()
        run: docker compose -f docker/compose.yaml logs --tail=200

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: task web:install
      - run: task web:lint
      - run: task web:test
      - run: task web:build

  node-red:
    name: Node-RED nodes (Node-RED runtime tests, pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: task nodered:pack
      - uses: actions/upload-artifact@v7
        with:
          name: node-red-contrib-quackquack
          path: integrations/node-red/dist/*.tgz
          retention-days: 14

  generate-summary:
    needs: [backend, frontend, node-red]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          echo "## 🚀 CI Run Summary" >> $GITHUB_STEP_SUMMARY
          for job in backend frontend node-red; do
            case "$job" in
              backend) r="${{ needs.backend.result }}" ;;
              frontend) r="${{ needs.frontend.result }}" ;;
              node-red) r="${{ needs.node-red.result }}" ;;
            esac
            case "$r" in
              success) icon="✅" ;; failure) icon="❌" ;; *) icon="⚠️" ;;
            esac
            echo "- **$job:** $icon $r" >> $GITHUB_STEP_SUMMARY
          done
