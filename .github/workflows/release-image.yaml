name: Release server image

# The platform image (Go server + built web app, server/Dockerfile).
# Released on its own tags, separate from the Node-RED package:
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# Pushes to GitHub's container registry only (ghcr.io/<owner>/quack_quack) as
# 1.2.0, 1.2 and latest, after the unit tests and a Trivy scan, and creates the
# GitHub release. Pre-releases (v1.2.0-rc.1) don't move `latest`. Nothing goes to
# Docker Hub. Auth is the workflow token; no secrets needed. A new package on GHCR
# is private: make it public under the repository's Packages → Package settings.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build and push (e.g. v1.2.0). Builds the selected ref; no GitHub release is created.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/quack_quack
  VERSION: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: task lint
      - run: task test
      - run: task web:install
      - run: task web:test

  image:
    name: Build, scan, push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
          flavor: latest=auto
          labels: |
            org.opencontainers.image.title=Quack Quack
            org.opencontainers.image.description=Real-time IoT dashboards: API, WebSocket gateway and web app
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # Scan before anything is published: build amd64 into the local daemon first.
      - name: Build for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          load: true
          tags: quack:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (fails on fixable CRITICAL)
        run: |
          trivy() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work aquasec/trivy:latest "$@"; }
          trivy image --quiet --format json -o trivy.json quack:scan
          count() { jq "[.Results[]?.Vulnerabilities[]? | select(.Severity==\"$1\")] | length" trivy.json; }
          {
            echo "## Trivy scan: ${VERSION}"
            echo
            echo "| Critical | High | Medium | Low |"
            echo "|---|---|---|---|"
            echo "| $(count CRITICAL) | $(count HIGH) | $(count MEDIUM) | $(count LOW) |"
            echo
            jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")]
              | unique_by(.VulnerabilityID) | .[:20][]
              | "- **\(.VulnerabilityID)** (\(.Severity)) `\(.PkgName)` \(.InstalledVersion) → \(.FixedVersion // "no fix")"' trivy.json
          } >> "$GITHUB_STEP_SUMMARY"
          trivy image --quiet --severity CRITICAL --ignore-unfixed --exit-code 1 quack:scan

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## Pushed"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          v="${TAG#v}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $prerelease --title "Quack Quack $TAG" \
            --notes "Image: \`docker pull ${GHCR_IMAGE}:${v}\`" \
            || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
