name: Release Node-RED nodes

# The Node-RED package node-red-contrib-quackquack (integrations/node-red), released
# on GitHub only, separately from the server image, on its own tags:
#
#   1. bump "version" in integrations/node-red/package.json (e.g. 0.2.0) and merge it
#   2. git tag node-red-v0.2.0 && git push origin node-red-v0.2.0
#
# The tag must match package.json. The workflow tests the nodes in a real Node-RED
# runtime, packs the npm tarball, and attaches it to a GitHub release (pre-release
# for versions like 0.2.0-alpha.1). Nothing is published to the npm registry.
# Users install the tarball from the release:
#   npm install https://github.com/<owner>/<repo>/releases/download/node-red-v0.2.0/node-red-contrib-quackquack-0.2.0.tgz
# or upload it in Node-RED: Manage palette → Install → upload.
on:
  push:
    tags: ['node-red-v*']
  workflow_dispatch: # test and pack only; the tarball is kept as a workflow artifact

permissions:
  contents: read

concurrency:
  group: release-node-red-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (Node-RED runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: task nodered:test

  release:
    name: Pack and release on GitHub
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
    defaults:
      run:
        working-directory: integrations/node-red # the test job runs `task` from the root
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5

      - name: Check the tag matches package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "node-red-v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected node-red-v${version})"
            exit 1
          fi

      - name: Pack
        id: pack
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          file=$(ls dist/*.tgz)
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$file")" >> "$GITHUB_OUTPUT"
          tar -tzf "$file" | sed 's/^/  /'
          (cd dist && sha256sum ./*.tgz > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: node-red-contrib-quackquack
          path: |
            integrations/node-red/dist/*.tgz
            integrations/node-red/dist/SHA256SUMS

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.pack.outputs.name }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ASSET}"
          cat > notes.md <<EOF
          Node-RED nodes for Quack Quack (\`quack-device\`, \`quack out\`, \`quack in\`). Node-RED 3.0+, Node.js 18+.

          **Install** in your Node-RED user directory (usually \`~/.node-red\`), then restart Node-RED:

          \`\`\`sh
          npm install ${url}
          \`\`\`

          Or download \`${ASSET}\` and upload it in Node-RED: **Manage palette → Install → upload** (the icon next to the search box).

          Setup and usage: [Node-RED integration docs](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/09_node_red.md).
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/SHA256SUMS --verify-tag --latest=false $prerelease \
            --title "Node-RED nodes $VERSION" --notes-file notes.md \
            || gh release upload "$GITHUB_REF_NAME" dist/*.tgz dist/SHA256SUMS --clobber
