name: Release Node-RED nodes

# The npm package node-red-contrib-quackquack (integrations/node-red). It is released
# separately from the server image, on its own tags:
#
#   1. bump "version" in integrations/node-red/package.json (e.g. 0.2.0) and merge it
#   2. git tag node-red-v0.2.0 && git push origin node-red-v0.2.0
#
# The tag must match package.json. The workflow tests, publishes to npm with
# provenance, and attaches the tarball to a GitHub release. Pre-releases
# (0.2.0-rc.1) are published under the npm dist-tag "next".
#
# npm auth (either one):
#   - trusted publishing: on npmjs.com, package settings → Trusted publisher →
#     GitHub Actions, this repository, workflow "release-node-red.yaml", environment "npm".
#     No secret needed.
#   - or a granular automation token in the NPM_TOKEN secret of the "npm" environment.
#
# Node-RED's flow library (flows.nodered.org) lists the package once it is on npm
# with the "node-red" keyword; use "add a node" there to list it immediately.
on:
  push:
    tags: ['node-red-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only test and pack (npm publish --dry-run); nothing is published'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-node-red-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (Node-RED runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: task nodered:test

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/node-red-contrib-quackquack
    permissions:
      contents: write # GitHub release
      id-token: write # npm provenance / trusted publishing
    defaults:
      run:
        working-directory: integrations/node-red # the test job runs `task` from the root
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5

      - name: Check the tag matches package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "node-red-v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected node-red-v${version})"
            exit 1
          fi
          case "$version" in *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;; *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;; esac

      - name: Pack
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          tar -tzf dist/*.tgz | sed 's/^/  /'

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          npm install -g npm@^11.5.1 # trusted publishing needs npm >= 11.5.1
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken '${NODE_AUTH_TOKEN}'
          fi
          flags="--provenance --access public --tag ${{ steps.version.outputs.dist_tag }}"
          if [ "$DRY_RUN" = "true" ]; then flags="$flags --dry-run"; fi
          # the ./ matters: npm reads "dist/x.tgz" as the GitHub repo "dist/x.tgz"
          npm publish ./dist/*.tgz $flags

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tgz --verify-tag --latest=false $prerelease \
            --title "Node-RED nodes $VERSION" \
            --notes "Install in Node-RED (**Manage palette → Install**) or with \`npm install node-red-contrib-quackquack@$VERSION\` in your Node-RED user directory. See [the package README](https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}/integrations/node-red#readme)." \
            || gh release upload "$GITHUB_REF_NAME" dist/*.tgz --clobber
