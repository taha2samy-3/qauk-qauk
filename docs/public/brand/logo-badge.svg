<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t-badge">
  <title id="t-badge">Quack Quack - Circular Badge</title>
  <defs>
    <linearGradient id="qq-badge-bg" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="qq-badge-ring" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  
  <!-- Outer metallic/glow ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#qq-badge-ring)" stroke-width="2.5"/>
  <!-- Inner badge fill -->
  <circle cx="32" cy="32" r="27.5" fill="url(#qq-badge-bg)"/>
  
  <!-- Centered duck -->
  <path d="M17.5 36.5C15.2 41.8 12.2 44.1 8 43.7C8.8 50 13.4 53.5 20 53.5H33C37.8 53.5 40.8 50.8 40.8 47C40.8 42 35.8 38.5 29.6 37.1Z" fill="#FFFFFF"/>
  <circle cx="23" cy="28.5" r="10.8" fill="#FFFFFF"/>
  <path d="M31.8 26.6C36.6 25.4 41.5 26 44.2 29.1C41.7 32.5 36.8 33.5 31.8 32.3Z" fill="#FBBF24"/>
  <circle cx="25.8" cy="25.5" r="2.2" fill="#1E1B4B"/>
  
  <!-- Radio signal waves -->
  <path d="M47 24.8A6.2 6.2 0 0 1 47 33.2" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M51 19.8A12 12 0 0 1 51 38.2" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" opacity="0.75"/>
</svg>
