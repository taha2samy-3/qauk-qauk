# Documentation site (VitePress). Included from the root Taskfile as `docs`.
# Content lives in ../docs; this folder only holds the site config and theme.
version: "3"

tasks:
  install:
    desc: Install docs-site dependencies
    dir: "{{.TASKFILE_DIR}}"
    sources: [package.json, pnpm-lock.yaml]
    cmds: [pnpm install --frozen-lockfile]
  dev:
    desc: Docs site with live reload on http://127.0.0.1:5174
    dir: "{{.TASKFILE_DIR}}"
    deps: [install]
    cmds: [pnpm dev]
  build:
    desc: Build the static docs site into docs/.vitepress/dist (fails on dead links and page render errors)
    dir: "{{.TASKFILE_DIR}}"
    deps: [install]
    cmds:
      # VitePress reports "build complete" even when a page throws during
      # rendering (the page ships empty), so scan the log and fail instead.
      - |
        set -o pipefail
        pnpm build 2>&1 | tee .vitepress/build.log
        if grep -qE "(TypeError|ReferenceError|SyntaxError):" .vitepress/build.log; then
          echo "docs: a page failed to render (see the error above)" >&2
          exit 1
        fi
  preview:
    desc: Serve the built docs site on http://127.0.0.1:4174
    dir: "{{.TASKFILE_DIR}}"
    deps: [build]
    cmds: [pnpm preview]
