<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t-gw">
  <title id="t-gw">Quack Quack - Gateway Hub</title>
  <defs>
    <linearGradient id="qq-gw-bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3730A3"/>
      <stop offset="0.5" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#qq-gw-bg)"/>
  
  <!-- Duck body & head -->
  <path d="M16.5 35.5C14.2 41.2 11 43.6 6.6 43.2C7.4 49.8 12.2 53.5 19 53.5H32.5C37.4 53.5 40.5 50.6 40.5 46.6C40.5 41.4 35.4 37.7 29 36.2Z" fill="#FFFFFF"/>
  <circle cx="22.5" cy="27.5" r="11" fill="#FFFFFF"/>
  <path d="M31.5 25.6C36.4 24.4 41.4 25 44.2 28.1C41.6 31.6 36.6 32.6 31.5 31.4Z" fill="#FBBF24"/>
  <circle cx="25.4" cy="24.4" r="2.3" fill="#1E1B4B"/>
  
  <!-- Gateway Mesh Lines connecting transports -->
  <line x1="42" y1="28" x2="52" y2="18" stroke="#38BDF8" stroke-width="1.6" stroke-dasharray="2 1.5"/>
  <line x1="43" y1="28.5" x2="55" y2="28.5" stroke="#38BDF8" stroke-width="1.8"/>
  <line x1="42" y1="29" x2="51" y2="39" stroke="#38BDF8" stroke-width="1.6" stroke-dasharray="2 1.5"/>
  <line x1="52" y1="18" x2="55" y2="28.5" stroke="#BAE6FD" stroke-width="1" opacity="0.6"/>
  <line x1="55" y1="28.5" x2="51" y2="39" stroke="#BAE6FD" stroke-width="1" opacity="0.6"/>

  <!-- Satellite Transport Nodes (WebSocket, MQTT, gRPC) -->
  <!-- Top Node: WebSocket -->
  <circle cx="52" cy="18" r="3" fill="#38BDF8"/>
  <circle cx="52" cy="18" r="1.2" fill="#FFFFFF"/>
  
  <!-- Mid Node: MQTT -->
  <circle cx="55" cy="28.5" r="3.4" fill="#FBBF24"/>
  <circle cx="55" cy="28.5" r="1.4" fill="#78350F"/>
  
  <!-- Bottom Node: gRPC -->
  <circle cx="51" cy="39" r="3" fill="#34D399"/>
  <circle cx="51" cy="39" r="1.2" fill="#FFFFFF"/>
</svg>
